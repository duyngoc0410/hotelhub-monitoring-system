version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: hotelhub-postgres

    restart: always

    environment:
      POSTGRES_DB: hotelhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - hotelhub-network

  pgadmin:
    image: dpage/pgadmin4

    container_name: hotelhub-pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotelhub.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - hotelhub-network

  redis:
    image: redis:7-alpine

    container_name: hotelhub-redis

    restart: always

    ports:
      - "6379:6379"

    networks:
      - hotelhub-network

volumes:
  postgres_data:

networks:
  hotelhub-network: